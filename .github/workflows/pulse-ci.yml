name: Quantic Pulse CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/quantic-pulse-v1]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Install frontend dependencies
        run: npm install --ignore-scripts
      - name: Validate frontend JavaScript
        run: node --check pulse.js
      - name: Validate Pulse DOM contract
        run: npm run test:pulse-ui
      - name: Build site
        run: npm run build
      - name: Install backend dependencies
        working-directory: backend
        run: npm install --ignore-scripts
      - name: Validate Pulse backend
        working-directory: backend
        run: |
          node --check pulse.mjs
          node --check server.mjs
          node --check start.mjs
      - name: Test Pulse API flows
        working-directory: backend
        run: npm test
      - name: Import Pulse module
        working-directory: backend
        run: node -e "import('./pulse.mjs').then(async m => { console.log(await m.pulseInfo()) })"
